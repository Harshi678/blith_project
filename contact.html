<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - The Fitness Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url(contact.jpg);
            background-size: cover;
            background-position: center;
        }

        .contact {
            border: 2px solid #525050;
            height: 80vh;
            border-radius: 20px;
            width: 35%;
            margin: auto;
            margin-top: 78px;
            padding: 40px;
        }

        #title {
            color: white;
            font-size: 50px;
            font-family: "Ubuntu", sans-serif;
            letter-spacing: 2px;
            display: block;
            text-align: center;
        }

        #submit {
            border-radius: 24px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
        }

        input {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 12px;
        }

        .details {
            color: white;
            font-size: 20px;
            padding: 50px;
        }
        textarea{
            resize: none;
            width: 100%;
            height: 114px;
        }
    </style>
</head>

<body>
    <div class="contact">
        <strong id="title">CONTACT US</strong>
        <div class="details">
            Full Name:<input type="text">
            Email Id: <input type="text">
            Phone Number: <input type="text">
            Subject: <input type="text">
            Details: <textarea placeholder="send a message!"></textarea>
            <input type="button" value="Submit" id="submit">
        </div>
    </div>
</body>

</html>
