<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url(img.jpg);
            background-size: cover;
            background-position: center;
        }

        .navbar {
            display: flex;
        }

        .left {
            font-size: 30px;
            font-family: "Ubuntu", sans-serif;
            width: 50%;
            margin-left: 80px;
            display: flex;
            align-items: center;
        }

        .right {
            width: 50%;
            text-align: right;
            padding: 36px;
        }

        a {
            text-decoration: none;
            font-size: 20px;
            padding: 30px;
            font-family: "Ubuntu", sans-serif;
            color: white;
        }

        #logo {
            width: 90px;
            cursor: pointer;
        }

        section {
            font-family: "Ubuntu", sans-serif;
            text-align: center;
            height: 90vh;
            display: flex;
            justify-content: center;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            gap: 1rem;
            color: white;
        }

        .footer {
            background-color: #222;
            color: grey;
            text-align: center;
            padding: 30px;
        }

        .footer a {
            color: grey;
            text-decoration: none;
            margin: 0 8px;
        }

        #end {
            margin: 20px;
        }

        .btn {
            border: 2px solid white;
            padding: 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.8s ease;

        }

        .btn:hover {
            background: transparent;
            color: white;
        }

        h1 {
            font-size: 60px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="left">
            <img src="logo_transparent.png" alt="logo" id="logo">
        </div>
        <div class="right">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Services</a>
            <a href="">Testimonials</a>
        </div>
    </nav>
    <section>
        <div class="content">
            <h1>Welcome to the Fitness Club!</h1>
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quo, possimus.</p>
            <button class="btn">Know More</button>
            <button class="btn">Contact Us</button>
        </div>
    </section>
    <footer class="footer">
        <p>&copy; 2026 Fitness Club. All rights reserved.</p>
        <p id="end">
            <a href="#">Home</a> |
            <a href="#">About</a> |
            <a href="#">Contact</a>
        </p>
    </footer>
</body>

</html>
